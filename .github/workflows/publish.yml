# 렌더링된 시안 → 인스타(카드뉴스·릴스)·스레드·유튜브 쇼츠. 각 서비스 API 토큰으로 직접 올린다 (LLM·Uplika 없음).
# 네이버 블로그·클립은 Uplika를 쓰는 Claude 루틴 ②가 올린다 (routine/publish_naver.md).
# 기본은 "시험 실행"이라 실제로 올리지 않는다. 저장소 변수 AUTO_PUBLISH=true 를 넣어야 예약 실행이 실제로 올린다.
name: 게시 (인스타·스레드·유튜브 쇼츠)

on:
  schedule:
    - cron: "30 2 * * *" # KST 11:30 (GitHub 예약은 늦을 수 있어, 정시가 필요하면 cron-job.org가 workflow_dispatch로 깨운다)
  workflow_dispatch:
    inputs:
      folder:
        description: "올릴 시안 폴더 이름 (drafts 브랜치 안). 비우면 가장 최근의 아직 안 올린 폴더"
        required: false
      dry_run:
        description: "true면 올리지 않고 무엇을 올릴지만 보여 준다"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: youth
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cardnews-bot
    env:
      DRAFTS_BRANCH: drafts
      # --- Secrets: 기존 my-site 저장소와 같은 계정이면 같은 값을 넣는다 ---
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # --- Variables (비우면 기본값) ---
      PLATFORMS: ${{ vars.PLATFORMS }} # 기본 instagram,reels,threads (+ 유튜브 인증값이 있으면 youtube 자동)
      YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY || vars.YOUTUBE_PRIVACY }} # my-site 동기화가 Secrets 로 복사하므로 Secrets 를 먼저 읽는다 # 기본 private, 공개는 public
      YOUTUBE_CATEGORY: ${{ vars.YOUTUBE_CATEGORY }}
      YOUTUBE_SYNTHETIC: ${{ vars.YOUTUBE_SYNTHETIC }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || vars.YOUTUBE_CHANNEL_ID }} # my-site 동기화가 Secrets 로 복사하므로 Secrets 를 먼저 읽는다
      # --- 이미지·영상 주소 호스팅: 이 (공개) 저장소의 drafts 브랜치 ---
      IMAGE_HOSTING: github
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: drafts
      GITHUB_DIR: images
      # 예약 실행은 AUTO_PUBLISH=true 일 때만 실제로 올리고, 수동 실행은 dry_run 입력을 따른다
      DRY_RUN: ${{ github.event_name == 'schedule' && vars.AUTO_PUBLISH != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      FOLDER: ${{ inputs.folder }}
    steps:
      - uses: actions/checkout@v4

      - name: LLM API 키가 환경에 없는지 확인
        working-directory: .
        run: |
          if env | grep -E '^(ANTHROPIC|GEMINI|OPENAI|GOOGLE|SHORTS_GEMINI)[A-Z_]*API_KEY='; then
            echo "::error::LLM API 키가 환경에 들어와 있습니다. 이 저장소에는 키를 두지 않습니다"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cardnews-bot/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 시안 브랜치 가져오기
        working-directory: .
        run: |
          git config --global user.name "youth-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin "$DRAFTS_BRANCH:$DRAFTS_BRANCH"; then
            git worktree add drafts "$DRAFTS_BRANCH"
          else
            echo "::warning::drafts 브랜치가 아직 없습니다 (렌더링이 한 번도 안 돌았습니다)"; echo "NO_DRAFTS=1" >> "$GITHUB_ENV"
          fi

      - name: 게시
        if: env.NO_DRAFTS != '1'
        run: |
          [ "$DRY_RUN" = "true" ] && FLAG="--dry-run" || FLAG=""
          [ "$DRY_RUN" = "true" ] && echo "::notice::시험 실행입니다. 실제로 올리지 않습니다 (예약 실행에서 올리려면 변수 AUTO_PUBLISH=true)"
          if [ -n "$FOLDER" ]; then python -m cardbot publish "$GITHUB_WORKSPACE/drafts/$FOLDER" $FLAG
          else python -m cardbot publish --latest --dir "$GITHUB_WORKSPACE/drafts" $FLAG; fi

      - name: 게시 결과(published.json)를 drafts 브랜치에 저장
        if: always() && env.NO_DRAFTS != '1' && env.DRY_RUN != 'true'
        working-directory: .
        run: |
          git -C drafts add -A
          git -C drafts diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git -C drafts commit -m "게시 기록: ${{ github.run_number }}"
          for i in 1 2 3; do
            git -C drafts fetch origin "$DRAFTS_BRANCH" 2>/dev/null && git -C drafts rebase FETCH_HEAD 2>/dev/null || true
            git -C drafts push origin "HEAD:$DRAFTS_BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "::error::drafts 브랜치 푸시 실패"; exit 1
